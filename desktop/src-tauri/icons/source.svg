<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square (macOS style) -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect x="32" y="32" width="960" height="480" rx="220" ry="220" fill="url(#glow)"/>

  <!-- Microphone body -->
  <rect x="412" y="220" width="200" height="320" rx="100" ry="100" fill="white" opacity="0.95"/>

  <!-- Microphone lines -->
  <line x1="462" y1="340" x2="562" y2="340" stroke="#6366f1" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
  <line x1="462" y1="390" x2="562" y2="390" stroke="#6366f1" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
  <line x1="462" y1="440" x2="562" y2="440" stroke="#6366f1" stroke-width="12" stroke-linecap="round" opacity="0.3"/>

  <!-- Microphone arc -->
  <path d="M 330 440 Q 330 620 512 620 Q 694 620 694 440" fill="none" stroke="white" stroke-width="36" stroke-linecap="round" opacity="0.9"/>

  <!-- Stand -->
  <line x1="512" y1="620" x2="512" y2="720" stroke="white" stroke-width="36" stroke-linecap="round" opacity="0.9"/>
  <line x1="412" y1="720" x2="612" y2="720" stroke="white" stroke-width="36" stroke-linecap="round" opacity="0.9"/>

  <!-- Sound waves - left -->
  <path d="M 240 340 Q 200 440 240 540" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
  <path d="M 170 300 Q 110 440 170 580" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.2"/>

  <!-- Sound waves - right -->
  <path d="M 784 340 Q 824 440 784 540" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
  <path d="M 854 300 Q 914 440 854 580" fill="none" stroke="white" stroke-width="24" stroke-linecap="round" opacity="0.2"/>

  <!-- Text dots (representing transcription) -->
  <circle cx="380" cy="800" r="14" fill="white" opacity="0.5"/>
  <rect x="420" y="788" width="180" height="24" rx="12" fill="white" opacity="0.5"/>
  <circle cx="380" cy="850" r="14" fill="white" opacity="0.35"/>
  <rect x="420" y="838" width="120" height="24" rx="12" fill="white" opacity="0.35"/>
</svg>
